<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OminiClin MNAnimat - Gestão Clínica Multidisciplinar</title>
    <script type="text/javascript">
      // Single Page Application Fallback para GitHub Pages
      var l = window.location;
      if (l.pathname && l.pathname !== '/') {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, -1).join('/') + '/#' + l.pathname);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
